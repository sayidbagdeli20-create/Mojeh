<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رزرو نوبت مژه</title>
  <meta name="theme-color" content="#2A1B2E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hero" id="hero-box">
    <div class="container">
      <svg class="lash-swoosh" viewBox="0 0 46 14" fill="none">
        <path d="M2 12 Q 14 -4 44 6" stroke="#C7A15C" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div id="brand-logo-wrap"></div>
      <div class="eyebrow" id="brand-name">استودیو زیبایی</div>
      <h1 id="hero-title">نوبتت رو با یه دست بگیر ✨</h1>
      <p id="hero-subtitle">خدمت رو انتخاب کن، ساعت خالی رو ببین، پرداخت کن — تمام.</p>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <a href="#" id="instagram-link" class="hidden" target="_blank" rel="noopener" style="display:flex; align-items:center; justify-content:center; width:38px; height:38px; color:#FBF6F3; text-decoration:none; border:1px solid rgba(251,246,243,0.35); border-radius:50%;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1"/></svg>
        </a>
        <a href="#" id="phone-link" class="hidden" style="display:flex; align-items:center; justify-content:center; width:38px; height:38px; color:#FBF6F3; text-decoration:none; border:1px solid rgba(251,246,243,0.35); border-radius:50%;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2Z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="container">

    <section id="service-section">
      <div class="section-title"><span class="num">۱</span> انتخاب خدمت</div>
      <div id="services"></div>
    </section>

    <section id="date-section" class="hidden">
      <div class="section-title"><span class="num">۲</span> انتخاب تاریخ</div>
      <div class="date-scroller" id="date-scroller"></div>
    </section>

    <section id="time-section" class="hidden">
      <div class="section-title"><span class="num">۳</span> انتخاب ساعت</div>
      <div class="slot-grid" id="slot-grid"></div>
    </section>

    <section id="form-section" class="hidden">
      <div class="section-title"><span class="num">۴</span> مشخصات تماس</div>
      <div class="field">
        <label>نام و نام‌خانوادگی</label>
        <input type="text" id="customer-name" placeholder="مثلاً سارا احمدی">
      </div>
      <div class="field">
        <label>شماره موبایل</label>
        <input type="tel" id="customer-phone" placeholder="09xxxxxxxxx" inputmode="numeric">
      </div>
    </section>

  </div>

  <div class="pay-bar hidden" id="pay-bar">
    <div>
      <div class="total-label">مبلغ قابل پرداخت</div>
      <div class="total-amount" id="total-amount">—</div>
    </div>
    <button class="btn" id="submit-btn">پرداخت و ثبت نوبت</button>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
