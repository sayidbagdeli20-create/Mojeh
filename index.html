<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>رزرو نوبت مژه</title>
  <meta name="theme-color" content="#2A1B2E">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hero">
    <div class="container">
      <div class="hero-top-row">
        <div class="brand-mark">
          <div class="mark-icon" id="brand-mark-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="#C7A15C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
              <path d="M2 12c3-4 6-6 10-6s7 2 10 6c-3 4-6 6-10 6s-7-2-10-6Z"/>
              <circle cx="12" cy="12" r="2.4"/>
            </svg>
          </div>
        </div>
      </div>
      <div class="eyebrow" id="brand-name" style="margin-top:18px;">استودیو زیبایی</div>
      <h1>نوبتت رو با یه دست بگیر ✨</h1>
      <p>خدمت رو انتخاب کن، ساعت خالی رو ببین، پرداخت کن — تمام.</p>
      <a href="#" id="instagram-link" class="ig-pill hidden" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="6"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1"/></svg>
        دنبال کردن در اینستاگرام
      </a>
    </div>
    <svg class="hero-wave" viewBox="0 0 400 34" preserveAspectRatio="none">
      <path d="M0,20 C100,34 300,0 400,16 L400,34 L0,34 Z" fill="#FBF6F3"/>
    </svg>
  </div>

  <div class="container">

    <section id="service-section">
      <div class="section-title">
        <span class="step-badge"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c3 4 6 6 10 6-4 0-7 2-10 6-3-4-6-6-10-6 4 0 7-2 10-6Z"/></svg></span>
        انتخاب خدمت
      </div>
      <div id="services"></div>
    </section>

    <section id="date-section" class="hidden">
      <div class="section-title">
        <span class="step-badge"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></span>
        انتخاب تاریخ
      </div>
      <div class="date-scroller" id="date-scroller"></div>
    </section>

    <section id="time-section" class="hidden">
      <div class="section-title">
        <span class="step-badge"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
        انتخاب ساعت
      </div>
      <div class="slot-grid" id="slot-grid"></div>
    </section>

    <section id="form-section" class="hidden">
      <div class="section-title">
        <span class="step-badge"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></span>
        مشخصات تماس
      </div>
      <div class="field field-icon-wrap">
        <label>نام و نام‌خانوادگی</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>
        <input type="text" id="customer-name" placeholder="مثلاً سارا احمدی">
      </div>
      <div class="field field-icon-wrap">
        <label>شماره موبایل</label>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
        <input type="tel" id="customer-phone" placeholder="09xxxxxxxxx" inputmode="numeric">
      </div>
    </section>

  </div>

  <div class="pay-bar hidden" id="pay-bar">
    <div>
      <div class="total-label">مبلغ قابل پرداخت</div>
      <div class="total-amount" id="total-amount">—</div>
    </div>
    <button class="btn" id="submit-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h14M12 5l7 7-7 7"/></svg>
      پرداخت و ثبت نوبت
    </button>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
